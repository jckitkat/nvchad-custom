# Wraps the stock ESP-WROVER-KIT board config but disables OpenOCD's
# FreeRTOS thread awareness first. With it on, OpenOCD reports each FreeRTOS
# task as a GDB "thread" whose id is the raw TCB address (e.g. 1073412708)
# instead of a small integer. cpptools/MIEngine hardcodes an assumption that
# the first thread has id "1" when correlating breakpoint/stop events, and
# silently drops the DAP "stopped" event (or, with stopAtEntry, errors with
# "Failed to find thread 1 for break event") against those TCB-address ids.
# Disabling RTOS awareness makes GDB report a plain "Thread 1" per core,
# which satisfies that assumption and makes nvim-dap's stop/breakpoint
# events work reliably. Trade-off: no per-FreeRTOS-task view in the
# debugger UI - use a plain gdb session (idf.py gdb-style) if you need that.
set ESP_RTOS none
source [find board/esp32-wrover-kit-3.3v.cfg]
